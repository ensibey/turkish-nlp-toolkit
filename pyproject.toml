[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-nlp-toolkit"
version = "0.2.0"
description = "Rule-based Turkish text preprocessing, agglutinative stemming, address normalization, and BERT classification utilities."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Enis Dogan", email = "enisdogan3535@gmail.com"}
]
keywords = ["turkish", "nlp", "text-processing", "stemmer", "address-parser", "bert"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
bert = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
turkish-nlp = "turkish_nlp.__main__:main"
